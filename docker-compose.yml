version: "3.1"

services:
  # Base de datos de la aplicación
  postgres-app:
    container_name: medassistant-db
    image: postgres:14.14-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: medassistant
    volumes:
      - ./postgres:/var/lib/postgresql/data

  # Base de datos de Keycloak
  postgres-keycloak:
    container_name: keycloak-db
    image: postgres:14.14-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - ./keycloak-postgres:/var/lib/postgresql/data

  # Keycloak
  keycloak:
    image: keycloak/keycloak:26.2.5
    container_name: medassistant-keycloak
    command: start-dev # Usar solo start cuando vayamos a produccion (solo para https)
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8090:8080"
    depends_on:
      - postgres-keycloak

  # Chroma (Vector Store)
  chroma:
    image: chromadb/chroma
    container_name: medassistant-chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE # Para que los vectores se guarden en disco y no se pierdan al reiniciar el contenedor
    volumes:
      - chroma-data:/chroma/chroma

volumes:
  medassistant-data:
  keycloak-data:
  chroma-data: